name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Run the deterministic test suite
        run: pytest tests/ -v --ignore=tests/test_agentdojo_harness.py
      # tests/test_agentdojo_harness.py needs the real `agentdojo` package,
      # which isn't on PyPI under a plain `pip install agentdojo` -- excluded
      # from CI for that reason, not skipped.
